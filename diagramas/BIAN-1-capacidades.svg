<rect x="85" y="765" width="545" height="165" rx="8" fill="#8A8A8A" stroke="#6B6B6B" stroke-width="2"/>
<text x="357.5" y="838.5" font-size="14" class="t" fill="#FFFFFF" text-anchor="middle">Regulatory Compliance</text>
<text x="357.5" y="856.5" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">[Fuera de alcance]</text>
<text x="357.5" y="871.5" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">Servicio Corporativo de Cribado: capacidad corporativa</text>
<rect x="650" y="765" width="545" height="165" rx="8" fill="#8A8A8A" stroke="#6B6B6B" stroke-width="2"/>
<text x="922.5" y="838.5" font-size="14" class="t" fill="#FFFFFF" text-anchor="middle">Card Transaction</text>
<text x="922.5" y="856.5" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">[Fuera de alcance]</text>
<text x="922.5" y="871.5" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">No hay tarjetas en el alcance del enunciado</text>
<rect x="1215" y="765" width="545" height="165" rx="8" fill="#8A8A8A" stroke="#6B6B6B" stroke-width="2"/>
<text x="1487.5" y="838.5" font-size="14" class="t" fill="#FFFFFF" text-anchor="middle">Customer Offer</text>
<text x="1487.5" y="856.5" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">[Fuera de alcance]</text>
<text x="1487.5" y="871.5" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">Sin venta de productos en el canal</text>
<rect x="1780" y="765" width="545" height="165" rx="8" fill="#8A8A8A" stroke="#6B6B6B" stroke-width="2"/>
<text x="2052.5" y="838.5" font-size="14" class="t" fill="#FFFFFF" text-anchor="middle">Collateral Administration</text>
<text x="2052.5" y="856.5" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">[Fuera de alcance]</text>
<text x="2052.5" y="871.5" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">Sin credito en el alcance</text>
<rect x="60" y="990" width="1120" height="50" rx="6" fill="#FFF6D6" stroke="#D9B94C"/>
<text x="71" y="1010" font-size="11" fill="#5B4A0E">QUE ES Y QUE NO ES ESTE MAPA: BIAN describe CAPACIDADES DE NEGOCIO, no una arquitectura tecnica. No dice que haya que crear un microservicio por dominio de servicio. Traducirlo literalmente</text>
<text x="71" y="1024" font-size="11" fill="#5B4A0E">produce decenas de servicios diminutos que solo se llaman entre si; su valor esta en dar un vocabulario comun y en revelar los huecos.</text>
<rect x="1230" y="990" width="1110" height="50" rx="6" fill="#FFF6D6" stroke="#D9B94C"/>
<text x="1241" y="1010" font-size="11" fill="#5B4A0E">COMO SE HA USADO AQUI: primero se decidio la descomposicion por capacidad de negocio y perfil operativo (ADR-05, ADR-38), y despues se contrasto con el catalogo BIAN para comprobar que no</text>
<text x="1241" y="1024" font-size="11" fill="#5B4A0E">faltaba ninguna capacidad relevante y para nombrar las fronteras con un vocabulario que cualquier banco reconoce.</text>
<rect x="60" y="1180" width="2280" height="50" rx="6" fill="#FFF6D6" stroke="#D9B94C"/>
<text x="71" y="1200" font-size="11" fill="#5B4A0E">LECTURA DE LA CORRESPONDENCIA: varios dominios de servicio se realizan FUERA del sistema que se disena -en el Core, en el producto de identidad o en la plataforma de onboarding-. Esto no es una carencia del diseno: es la consecuencia de respetar los sistemas de registro existentes en lugar de duplicar sus capacidades en el canal (ADR-23, ADR-15, ADR-17). Trazabilidad: H-15 · ADR-05 · criterio 3 de</text>
<text x="71" y="1214" font-size="11" fill="#5B4A0E">evaluacion.</text>
</svg>
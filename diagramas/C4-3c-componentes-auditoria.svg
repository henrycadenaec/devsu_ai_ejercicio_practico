<text x="1160.0" y="298.5" font-size="14" class="t" fill="#000000" text-anchor="middle">Normalizador Bitemporal</text>
<text x="1160.0" y="316.5" font-size="10.5" class="s" fill="#000000" text-anchor="middle">[Patron: Bitemporal Record]</text>
<text x="1160.0" y="331.5" font-size="10.5" class="s" fill="#000000" text-anchor="middle">Guarda cuando ocurrio el hecho y cuando se registro.</text>
<rect x="1460" y="250" width="320" height="115" rx="8" fill="#85BBF0" stroke="#5D82A8" stroke-width="2"/>
<text x="1620.0" y="298.5" font-size="14" class="t" fill="#000000" text-anchor="middle">Clasificador por Criticidad</text>
<text x="1620.0" y="316.5" font-size="10.5" class="s" fill="#000000" text-anchor="middle">[Patron: Strategy]</text>
<text x="1620.0" y="331.5" font-size="10.5" class="s" fill="#000000" text-anchor="middle">Operacion monetaria, seguridad o navegacion.</text>
<rect x="1000" y="430" width="320" height="115" rx="8" fill="#85BBF0" stroke="#5D82A8" stroke-width="2"/>
<text x="1160.0" y="478.5" font-size="14" class="t" fill="#000000" text-anchor="middle">Encadenador de Resumenes</text>
<text x="1160.0" y="496.5" font-size="10.5" class="s" fill="#000000" text-anchor="middle">[Patron: Hash Chain]</text>
<text x="1160.0" y="511.5" font-size="10.5" class="s" fill="#000000" text-anchor="middle">Cada lote incorpora el resumen del lote anterior.</text>
<rect x="1460" y="430" width="320" height="115" rx="8" fill="#85BBF0" stroke="#5D82A8" stroke-width="2"/>
<text x="1620.0" y="478.5" font-size="14" class="t" fill="#000000" text-anchor="middle">Escritor por Niveles</text>
<text x="1620.0" y="496.5" font-size="10.5" class="s" fill="#000000" text-anchor="middle">[Patron: Tiering]</text>
<text x="1620.0" y="511.5" font-size="10.5" class="s" fill="#000000" text-anchor="middle">Escribe en acceso inmediato y en archivo probatorio.</text>
<rect x="520" y="610" width="800" height="115" rx="8" fill="#85BBF0" stroke="#5D82A8" stroke-width="2"/>

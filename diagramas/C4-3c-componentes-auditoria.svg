<rect x="60" y="100" width="300" height="200" rx="6" fill="#FFF6D6" stroke="#D9B94C"/>
<text x="71" y="120" font-size="11" fill="#5B4A0E">La captura es ASINCRONA: la auditoria no anade</text>
<text x="71" y="134" font-size="11" fill="#5B4A0E">latencia a la operacion ni puede hacerla fallar.</text>
<text x="71" y="148" font-size="11" fill="#5B4A0E">La garantia de que nada se pierde no viene de</text>
<text x="71" y="162" font-size="11" fill="#5B4A0E">escribir en linea, sino de la bandeja de salida</text>
<text x="71" y="176" font-size="11" fill="#5B4A0E">del servicio de origen (ADR-31).</text>
<rect x="60" y="320" width="300" height="265" rx="6" fill="#FFF6D6" stroke="#D9B94C"/>
<text x="71" y="340" font-size="11" fill="#5B4A0E">Bitemporalidad: registrar CUANDO OCURRIO el hecho</text>
<text x="71" y="354" font-size="11" fill="#5B4A0E">y CUANDO SE SUPO permite responder a la pregunta</text>
<text x="71" y="368" font-size="11" fill="#5B4A0E">que hace un auditor, que no es cual es el saldo de</text>
<text x="71" y="382" font-size="11" fill="#5B4A0E">hoy, sino que le mostro el sistema al cliente el</text>
<text x="71" y="396" font-size="11" fill="#5B4A0E">dia 14 a las 10:32. Sin las dos fechas, un dato</text>
<text x="71" y="410" font-size="11" fill="#5B4A0E">corregido despues borra la version que el cliente</text>
<text x="71" y="424" font-size="11" fill="#5B4A0E">vio.</text>
<rect x="1960" y="100" width="290" height="270" rx="6" fill="#FFF6D6" stroke="#D9B94C"/>
<text x="1971" y="120" font-size="11" fill="#5B4A0E">El modo de cumplimiento del bloqueo de objetos</text>
<text x="1971" y="134" font-size="11" fill="#5B4A0E">impide borrar el registro incluso a un</text>
<text x="1971" y="148" font-size="11" fill="#5B4A0E">administrador de la cuenta. El encadenamiento de</text>
<text x="1971" y="162" font-size="11" fill="#5B4A0E">resumenes permite DEMOSTRAR ante un tercero que</text>
<text x="1971" y="176" font-size="11" fill="#5B4A0E">no hubo alteracion, no solo afirmarlo.</text>

<text x="71" y="270" font-size="11" fill="#5B4A0E">El disparador es el movimiento registrado en el</text>
<text x="71" y="284" font-size="11" fill="#5B4A0E">Core, no la accion en la aplicacion. Solo asi se</text>
<text x="71" y="298" font-size="11" fill="#5B4A0E">cubren los movimientos de cajero, comercio y</text>
<text x="71" y="312" font-size="11" fill="#5B4A0E">abonos entrantes, que son la mayoria (H-06).</text>
<rect x="60" y="780" width="300" height="175" rx="6" fill="#FFF6D6" stroke="#D9B94C"/>
<text x="71" y="800" font-size="11" fill="#5B4A0E">La evidencia se conserva 7 anos y el contenido del</text>
<text x="71" y="814" font-size="11" fill="#5B4A0E">mensaje 12 meses: se satisface la carga probatoria</text>
<text x="71" y="828" font-size="11" fill="#5B4A0E">sin retener datos personales mas tiempo del</text>
<text x="71" y="842" font-size="11" fill="#5B4A0E">necesario (ADR-37).</text>
<rect x="1960" y="100" width="290" height="270" rx="6" fill="#FFF6D6" stroke="#D9B94C"/>
<text x="1971" y="120" font-size="11" fill="#5B4A0E">Dos proveedores no aportan redundancia si</text>
<text x="1971" y="134" font-size="11" fill="#5B4A0E">comparten infraestructura, porque fallarian a la</text>
<text x="1971" y="148" font-size="11" fill="#5B4A0E">vez. Lo que se exige por contrato es DIVERSIDAD</text>
<text x="1971" y="162" font-size="11" fill="#5B4A0E">DE RUTA —operador y centro de datos distintos—,</text>
<text x="1971" y="176" font-size="11" fill="#5B4A0E">no simple pluralidad de contratos (ADR-36).</text>

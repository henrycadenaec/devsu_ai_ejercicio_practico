<text x="1160.0" y="478.5" font-size="14" class="t" fill="#000000" text-anchor="middle">Despachador</text>
<text x="1160.0" y="496.5" font-size="10.5" class="s" fill="#000000" text-anchor="middle">[Patron: Content-Based Router]</text>
<text x="1160.0" y="511.5" font-size="10.5" class="s" fill="#000000" text-anchor="middle">Encamina a la cola propia de cada proveedor.</text>
<rect x="1460" y="430" width="320" height="115" rx="8" fill="#85BBF0" stroke="#5D82A8" stroke-width="2"/>
<text x="1620.0" y="478.5" font-size="14" class="t" fill="#000000" text-anchor="middle">Colas por Proveedor</text>
<text x="1620.0" y="496.5" font-size="10.5" class="s" fill="#000000" text-anchor="middle">[Patron: Bulkhead]</text>
<text x="1620.0" y="511.5" font-size="10.5" class="s" fill="#000000" text-anchor="middle">Un proveedor lento no frena la entrega de los demas.</text>
<rect x="520" y="610" width="320" height="115" rx="8" fill="#85BBF0" stroke="#5D82A8" stroke-width="2"/>
<text x="680.0" y="658.5" font-size="14" class="t" fill="#000000" text-anchor="middle">Registro de Evidencia</text>
<text x="680.0" y="676.5" font-size="10.5" class="s" fill="#000000" text-anchor="middle">[Patron: Append-only]</text>
<text x="680.0" y="691.5" font-size="10.5" class="s" fill="#000000" text-anchor="middle">Destinatario, canal, proveedor, intentos y resultado.</text>
<rect x="1000" y="610" width="320" height="115" rx="8" fill="#85BBF0" stroke="#5D82A8" stroke-width="2"/>

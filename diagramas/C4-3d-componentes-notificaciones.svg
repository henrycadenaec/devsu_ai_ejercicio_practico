<text x="1160.0" y="685.0" font-size="10.5" class="s" fill="#000000" text-anchor="middle">Espera creciente con aleatoriedad y cambio de</text>
<text x="1160.0" y="698.0" font-size="10.5" class="s" fill="#000000" text-anchor="middle">proveedor.</text>
<rect x="1460" y="610" width="320" height="115" rx="8" fill="#85BBF0" stroke="#5D82A8" stroke-width="2"/>

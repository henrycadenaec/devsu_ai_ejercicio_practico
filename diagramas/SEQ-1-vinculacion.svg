<text x="293.0" y="1556.0" font-size="11.5" font-weight="500" fill="#1F2937" text-anchor="middle">Acceso disponible</text>
<rect x="50.0" y="110" width="196" height="74" rx="8" fill="#08427B" stroke="#052E56" stroke-width="2"/>
<text x="148.0" y="144.5" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Cliente</text>
<text x="148.0" y="160.5" font-size="10" fill="#FFFFFF" opacity="0.8" text-anchor="middle">[Persona natural]</text>
<rect x="340.0" y="110" width="196" height="74" rx="8" fill="#1168BD" stroke="#0B4884" stroke-width="2"/>
<text x="438.0" y="144.5" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Aplicacion Movil</text>
<text x="438.0" y="160.5" font-size="10" fill="#FFFFFF" opacity="0.8" text-anchor="middle">[Flutter]</text>
<rect x="630.0" y="110" width="196" height="74" rx="8" fill="#4F6B7A" stroke="#37505C" stroke-width="2"/>
<text x="728.0" y="144.5" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Plataforma de Onboarding</text>
<text x="728.0" y="160.5" font-size="10" fill="#FFFFFF" opacity="0.8" text-anchor="middle">[Sistema del banco]</text>
<rect x="920.0" y="110" width="196" height="74" rx="8" fill="#8A8A8A" stroke="#6B6B6B" stroke-width="2"/>
<text x="1018.0" y="144.5" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Proveedor de Verificacion</text>
<text x="1018.0" y="160.5" font-size="10" fill="#FFFFFF" opacity="0.8" text-anchor="middle">[Sistema externo]</text>
<rect x="1210.0" y="110" width="196" height="74" rx="8" fill="#4F6B7A" stroke="#37505C" stroke-width="2"/>
<text x="1308.0" y="144.5" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Producto de Identidad</text>
<text x="1308.0" y="160.5" font-size="10" fill="#FFFFFF" opacity="0.8" text-anchor="middle">[Sistema del banco]</text>
<rect x="1500.0" y="110" width="196" height="74" rx="8" fill="#4F6B7A" stroke="#37505C" stroke-width="2"/>
<text x="1598.0" y="144.5" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Core Bancario</text>
<text x="1598.0" y="160.5" font-size="10" fill="#FFFFFF" opacity="0.8" text-anchor="middle">[Sistema del banco]</text>
<rect x="1746" y="556" width="284" height="74" rx="6" fill="#FFF6D6" stroke="#D9B94C"/>
<text x="1758" y="575" font-size="11" fill="#5B4A0E">El testigo es de un solo uso y caducidad corta.</text>
<text x="1758" y="589" font-size="11" fill="#5B4A0E">La aplicacion nunca recibe credenciales del</text>
<text x="1758" y="603" font-size="11" fill="#5B4A0E">proveedor: recibe permiso para una sesion</text>
<text x="1758" y="617" font-size="11" fill="#5B4A0E">concreta.</text>
<rect x="1746" y="760" width="284" height="102" rx="6" fill="#FFF6D6" stroke="#D9B94C"/>
<text x="1758" y="779" font-size="11" fill="#5B4A0E">H-26 · La imagen biometrica NO pasa por el canal</text>
<text x="1758" y="793" font-size="11" fill="#5B4A0E">ni se almacena en el banco. El banco recibe el</text>
<text x="1758" y="807" font-size="11" fill="#5B4A0E">VEREDICTO y el nivel de aseguramiento alcanzado,</text>
<text x="1758" y="821" font-size="11" fill="#5B4A0E">no el dato biometrico. Es lo que reduce el</text>
<text x="1758" y="835" font-size="11" fill="#5B4A0E">alcance de proteccion de datos y evita custodiar</text>
<text x="1758" y="849" font-size="11" fill="#5B4A0E">un dato irrevocable (ADR-18, LOPDP).</text>
<rect x="1746" y="902" width="284" height="74" rx="6" fill="#FFF6D6" stroke="#D9B94C"/>
<text x="1758" y="921" font-size="11" fill="#5B4A0E">El aviso entrante se trata como entrada NO</text>
<text x="1758" y="935" font-size="11" fill="#5B4A0E">confiable: se verifica la firma del cuerpo, la</text>
<text x="1758" y="949" font-size="11" fill="#5B4A0E">marca temporal y el identificador de evento</text>
<text x="1758" y="963" font-size="11" fill="#5B4A0E">antes de procesarlo (ADR-22).</text>
<rect x="1746" y="1306" width="284" height="88" rx="6" fill="#FFF6D6" stroke="#D9B94C"/>
<text x="1758" y="1325" font-size="11" fill="#5B4A0E">NIST SP 800-63 · El nivel IAL alcanzado en este</text>
<text x="1758" y="1339" font-size="11" fill="#5B4A0E">momento condiciona despues el nivel AAL exigible</text>
<text x="1758" y="1353" font-size="11" fill="#5B4A0E">en cada operacion. Vincular la identidad con una</text>
<text x="1758" y="1367" font-size="11" fill="#5B4A0E">verificacion debil y despues exigir</text>
<text x="1758" y="1381" font-size="11" fill="#5B4A0E">autenticacion fuerte no corrige el origen.</text>
<rect x="1746" y="1568" width="284" height="102" rx="6" fill="#FFF6D6" stroke="#D9B94C"/>
<text x="1758" y="1587" font-size="11" fill="#5B4A0E">A partir de aqui el canal solo USA la identidad;</text>
<text x="1758" y="1601" font-size="11" fill="#5B4A0E">establecerla fue responsabilidad del onboarding.</text>
<text x="1758" y="1615" font-size="11" fill="#5B4A0E">Separar ambas cosas permite cambiar de proveedor</text>
<text x="1758" y="1629" font-size="11" fill="#5B4A0E">de verificacion sin tocar el canal, y que</text>
<text x="1758" y="1643" font-size="11" fill="#5B4A0E">oficina y web reutilicen el mismo proceso</text>
<text x="1758" y="1657" font-size="11" fill="#5B4A0E">(H-20).</text>
</svg>
<line x1="154.5" y1="698" x2="431.5" y2="698" stroke="#3F4A57" stroke-width="1.7" marker-end="url(#fl)"/>
<text x="293.0" y="690.0" font-size="11.5" font-weight="500" fill="#1F2937" text-anchor="middle">Presenta el documento y su rostro</text>
<line x1="444.5" y1="756" x2="1011.5" y2="756" stroke="#3F4A57" stroke-width="1.7" marker-end="url(#fl)"/>
<text x="728.0" y="735.0" font-size="11.5" font-weight="500" fill="#1F2937" text-anchor="middle">Envia la captura directamente al proveedor</text>
<text x="728.0" y="748.0" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="middle">[HTTPS · TLS 1.3 · SDK certificado]</text>
<path d="M1024.0,814 h56 v34 h-52" fill="none" stroke="#3F4A57" stroke-width="1.7" marker-end="url(#fl)"/>

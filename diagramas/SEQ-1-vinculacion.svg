<text x="1088.0" y="831.0" font-size="11.5" font-weight="500" fill="#1F2937" text-anchor="start">documento-rostro</text>
<text x="1088.0" y="844.0" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="start">[ISO/IEC 30107-3]</text>
<line x1="1011.5" y1="898" x2="734.5" y2="898" stroke="#3F4A57" stroke-width="1.7" marker-end="url(#fl)" stroke-dasharray="7 5"/>
<text x="873.0" y="877.0" font-size="11.5" font-weight="500" fill="#1F2937" text-anchor="middle">Veredicto y nivel de aseguramiento alcanzado</text>
<text x="873.0" y="890.0" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="middle">[Aviso firmado · HTTPS]</text>
<line x1="734.5" y1="1070" x2="1591.5" y2="1070" stroke="#3F4A57" stroke-width="1.7" marker-end="url(#fl)"/>
<text x="1163.0" y="1049.0" font-size="11.5" font-weight="500" fill="#1F2937" text-anchor="middle">Comprueba o crea al cliente</text>
<text x="1163.0" y="1062.0" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="middle">[MQ · enlace privado]</text>
<line x1="1591.5" y1="1128" x2="734.5" y2="1128" stroke="#3F4A57" stroke-width="1.7" marker-end="url(#fo)" stroke-dasharray="7 5"/>
<text x="1163.0" y="1120.0" font-size="11.5" font-weight="500" fill="#1F2937" text-anchor="middle">Identificador de cliente</text>
<line x1="734.5" y1="1186" x2="1301.5" y2="1186" stroke="#3F4A57" stroke-width="1.7" marker-end="url(#fl)"/>
<text x="1018.0" y="1165.0" font-size="11.5" font-weight="500" fill="#1F2937" text-anchor="middle">Provisiona la identidad con su nivel IAL</text>
<text x="1018.0" y="1178.0" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="middle">[SCIM 2.0 · mTLS]</text>
<line x1="1301.5" y1="1244" x2="734.5" y2="1244" stroke="#3F4A57" stroke-width="1.7" marker-end="url(#fo)" stroke-dasharray="7 5"/>
<text x="1018.0" y="1236.0" font-size="11.5" font-weight="500" fill="#1F2937" text-anchor="middle">Identidad creada</text>
<line x1="721.5" y1="1302" x2="444.5" y2="1302" stroke="#3F4A57" stroke-width="1.7" marker-end="url(#fo)" stroke-dasharray="7 5"/>
<text x="583.0" y="1294.0" font-size="11.5" font-weight="500" fill="#1F2937" text-anchor="middle">Vinculacion completada</text>
<line x1="444.5" y1="1448" x2="1301.5" y2="1448" stroke="#3F4A57" stroke-width="1.7" marker-end="url(#fl)"/>
<text x="873.0" y="1427.0" font-size="11.5" font-weight="500" fill="#1F2937" text-anchor="middle">Registra el factor del dispositivo</text>
<text x="873.0" y="1440.0" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="middle">[OIDC · PKCE · TLS 1.3]</text>
<line x1="1301.5" y1="1506" x2="444.5" y2="1506" stroke="#3F4A57" stroke-width="1.7" marker-end="url(#fo)" stroke-dasharray="7 5"/>
<text x="873.0" y="1498.0" font-size="11.5" font-weight="500" fill="#1F2937" text-anchor="middle">Identidad lista para autenticar</text>

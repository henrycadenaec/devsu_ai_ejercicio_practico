<line x1="1780.0" y1="527.5" x2="1960.0" y2="532.5" stroke="#666" stroke-width="2" marker-end="url(#fl)"/>
<rect x="1815.4" y="513.0" width="109.2" height="34.0" rx="4" fill="#FFFFFF" stroke="#E5E7EB"/>
<text x="1870.0" y="528.0" font-size="10.5" fill="#374151" text-anchor="middle">Consulta y ordena</text>
<text x="1870.0" y="541.0" font-size="10.5" fill="#6B7280" text-anchor="middle">[REST · mTLS]</text>
<line x1="1160.0" y1="585.0" x2="770.0" y2="650.0" stroke="#666" stroke-width="2" marker-end="url(#fl)"/>
<rect x="927.2" y="607.0" width="75.6" height="21.0" rx="4" fill="#FFFFFF" stroke="#E5E7EB"/>

<text x="1206.0" y="237.8" font-size="10.5" fill="#6B7280" text-anchor="middle">[RFC 8693 · TLS]</text>
<line x1="520.0" y1="347.5" x2="360.0" y2="347.5" stroke="#666" stroke-width="2" marker-end="url(#fl)"/>

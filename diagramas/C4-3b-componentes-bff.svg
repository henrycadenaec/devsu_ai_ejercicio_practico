<line x1="1160.0" y1="405.0" x2="1160.0" y2="470.0" stroke="#666" stroke-width="2" marker-end="url(#fl)"/>
<rect x="1122.2" y="420.5" width="75.6" height="34.0" rx="4" fill="#FFFFFF" stroke="#E5E7EB"/>

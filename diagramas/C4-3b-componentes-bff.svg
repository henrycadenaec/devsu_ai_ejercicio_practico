<text x="1160.0" y="448.5" font-size="10.5" fill="#374151" text-anchor="middle">autenticada</text>
<line x1="1000.0" y1="527.5" x2="840.0" y2="527.5" stroke="#666" stroke-width="2" marker-end="url(#fl)"/>
<rect x="865.4" y="510.5" width="109.2" height="34.0" rx="4" fill="#FFFFFF" stroke="#E5E7EB"/>

<rect x="60" y="85" width="300" height="90" rx="8" fill="#438DD5" stroke="#2E6295" stroke-width="2"/>
<text x="210.0" y="121.0" font-size="14" class="t" fill="#FFFFFF" text-anchor="middle">Aplicacion Web</text>
<text x="210.0" y="139.0" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">[Angular]</text>
<text x="210.0" y="154.0" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">No custodia credenciales</text>
<rect x="520" y="85" width="320" height="90" rx="8" fill="#438DD5" stroke="#2E6295" stroke-width="2"/>
<text x="680.0" y="127.5" font-size="14" class="t" fill="#FFFFFF" text-anchor="middle">Puerta de enlace</text>
<text x="680.0" y="145.5" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">[Amazon API Gateway]</text>
<rect x="1460" y="85" width="320" height="90" rx="8" fill="#4F6B7A" stroke="#37505C" stroke-width="2"/>
<text x="1620.0" y="127.5" font-size="14" class="t" fill="#FFFFFF" text-anchor="middle">Producto de Identidad</text>
<text x="1620.0" y="145.5" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">[Sistema del banco]</text>

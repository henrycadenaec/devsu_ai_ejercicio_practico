<text x="210.0" y="347.5" font-size="14" class="t" fill="#FFFFFF" text-anchor="middle">Sesion y cache</text>
<text x="210.0" y="365.5" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">[ElastiCache Redis]</text>
<text x="210.0" y="380.5" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">Sesion del navegador y respuestas cacheables</text>
<rect x="1960" y="470" width="290" height="125" rx="8" fill="#438DD5" stroke="#2E6295" stroke-width="2"/>
<text x="2105.0" y="523.5" font-size="14" class="t" fill="#FFFFFF" text-anchor="middle">Servicios de dominio</text>
<text x="2105.0" y="541.5" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">[Contenedores]</text>
<text x="2105.0" y="556.5" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">Cliente, Movimientos, Transferencias…</text>
<rect x="520" y="290" width="320" height="115" rx="8" fill="#85BBF0" stroke="#5D82A8" stroke-width="2"/>
<text x="680.0" y="332.0" font-size="14" class="t" fill="#000000" text-anchor="middle">Custodio de Credenciales</text>
<text x="680.0" y="350.0" font-size="10.5" class="s" fill="#000000" text-anchor="middle">[Patron: Token Handler · RFC 8693]</text>
<text x="680.0" y="365.0" font-size="10.5" class="s" fill="#000000" text-anchor="middle">La credencial nunca llega al navegador; se intercambia</text>
<text x="680.0" y="378.0" font-size="10.5" class="s" fill="#000000" text-anchor="middle">por destino.</text>
<rect x="1000" y="290" width="320" height="115" rx="8" fill="#85BBF0" stroke="#5D82A8" stroke-width="2"/>
<text x="1160.0" y="338.5" font-size="14" class="t" fill="#000000" text-anchor="middle">Controlador de Sesion</text>
<text x="1160.0" y="356.5" font-size="10.5" class="s" fill="#000000" text-anchor="middle">[Spring Security]</text>
<text x="1160.0" y="371.5" font-size="10.5" class="s" fill="#000000" text-anchor="middle">Codigo de autorizacion con PKCE; recoge el retorno.</text>
<rect x="1460" y="290" width="320" height="115" rx="8" fill="#85BBF0" stroke="#5D82A8" stroke-width="2"/>
<text x="1620.0" y="338.5" font-size="14" class="t" fill="#000000" text-anchor="middle">Filtro Anti-CSRF</text>
<text x="1620.0" y="356.5" font-size="10.5" class="s" fill="#000000" text-anchor="middle">[Patron: Doble testigo]</text>
<text x="1620.0" y="371.5" font-size="10.5" class="s" fill="#000000" text-anchor="middle">Exige testigo propio en toda operacion que modifica.</text>
<rect x="520" y="470" width="320" height="115" rx="8" fill="#85BBF0" stroke="#5D82A8" stroke-width="2"/>
<text x="680.0" y="518.5" font-size="14" class="t" fill="#000000" text-anchor="middle">Cache de Respuesta</text>
<text x="680.0" y="536.5" font-size="10.5" class="s" fill="#000000" text-anchor="middle">[Patron: Cache-Aside]</text>
<text x="680.0" y="551.5" font-size="10.5" class="s" fill="#000000" text-anchor="middle">Solo datos no sensibles, con caducidad corta.</text>
<rect x="1000" y="470" width="320" height="115" rx="8" fill="#85BBF0" stroke="#5D82A8" stroke-width="2"/>
<text x="1160.0" y="518.5" font-size="14" class="t" fill="#000000" text-anchor="middle">Compositor de Vistas</text>
<text x="1160.0" y="536.5" font-size="10.5" class="s" fill="#000000" text-anchor="middle">[Patron: API Composition]</text>
<text x="1160.0" y="551.5" font-size="10.5" class="s" fill="#000000" text-anchor="middle">Agrega en paralelo varias llamadas en una respuesta.</text>
<rect x="1460" y="470" width="320" height="115" rx="8" fill="#85BBF0" stroke="#5D82A8" stroke-width="2"/>
<text x="1620.0" y="512.0" font-size="14" class="t" fill="#000000" text-anchor="middle">Clientes de Dominio</text>
<text x="1620.0" y="530.0" font-size="10.5" class="s" fill="#000000" text-anchor="middle">[Resilience4j]</text>
<text x="1620.0" y="545.0" font-size="10.5" class="s" fill="#000000" text-anchor="middle">Tiempo limite, reintento, corte de circuito y</text>
<text x="1620.0" y="558.0" font-size="10.5" class="s" fill="#000000" text-anchor="middle">compartimento.</text>
<rect x="520" y="650" width="1260" height="105" rx="8" fill="#85BBF0" stroke="#5D82A8" stroke-width="2"/>
<text x="1150.0" y="693.5" font-size="14" class="t" fill="#000000" text-anchor="middle">Interceptor de Trazas y Actividad</text>
<text x="1150.0" y="711.5" font-size="10.5" class="s" fill="#000000" text-anchor="middle">[OpenTelemetry]</text>
<text x="1150.0" y="726.5" font-size="10.5" class="s" fill="#000000" text-anchor="middle">Propaga el identificador de traza a todos los saltos y emite el registro de actividad.</text>
<rect x="1976" y="675" width="34" height="26" rx="8" fill="#85BBF0" stroke="#5D82A8" stroke-width="2"/>
<rect x="1976" y="703" width="34" height="26" rx="8" fill="#438DD5" stroke="#2E6295" stroke-width="2"/>
<path d="M1976,745 a17,14 0 0,1 34,0 l0,-2 a17,14 0 0,1 -34,0 z" fill="#438DD5" stroke="#2E6295" stroke-width="2"/>
<ellipse cx="1993.0" cy="745" rx="17" ry="14" fill="#438DD5" stroke="#2E6295" stroke-width="2"/>
<rect x="1976" y="759" width="34" height="26" rx="8" fill="#4F6B7A" stroke="#37505C" stroke-width="2"/>
<rect x="60" y="470" width="300" height="280" rx="6" fill="#FFF6D6" stroke="#D9B94C"/>
<text x="71" y="490" font-size="11" fill="#5B4A0E">Este contenedor es el UNICO que manipula la</text>
<text x="71" y="504" font-size="11" fill="#5B4A0E">credencial de acceso. El navegador solo recibe una</text>
<text x="71" y="518" font-size="11" fill="#5B4A0E">cookie inaccesible desde guiones y restringida al</text>
<text x="71" y="532" font-size="11" fill="#5B4A0E">mismo sitio, de modo que un compromiso de la</text>
<text x="71" y="546" font-size="11" fill="#5B4A0E">aplicacion web no expone la credencial (ADR-10).</text>
<text x="71" y="560" font-size="11" fill="#5B4A0E">Es tambien la razon de que exista un backend por</text>
<text x="71" y="574" font-size="11" fill="#5B4A0E">canal y no uno compartido.</text>
<rect x="1960" y="100" width="290" height="275" rx="6" fill="#FFF6D6" stroke="#D9B94C"/>
<text x="1971" y="120" font-size="11" fill="#5B4A0E">La composicion invoca a los servicios de dominio</text>
<text x="1971" y="134" font-size="11" fill="#5B4A0E">EN PARALELO y devuelve una respuesta por</text>
<text x="1971" y="148" font-size="11" fill="#5B4A0E">pantalla. Sin ella, una pantalla de inicio</text>
<text x="1971" y="162" font-size="11" fill="#5B4A0E">exigiria del orden de diez llamadas desde el</text>
<text x="1971" y="176" font-size="11" fill="#5B4A0E">navegador, con el coste de latencia que eso</text>
<text x="1971" y="190" font-size="11" fill="#5B4A0E">supone en red movil (ADR-09).</text>
<rect x="2018" y="674" width="220" height="20" rx="6" fill="none" stroke="none"/>
<text x="2029" y="694" font-size="11" fill="#5B4A0E">Componente del contenedor</text>
<rect x="2018" y="702" width="220" height="20" rx="6" fill="none" stroke="none"/>
<text x="2029" y="722" font-size="11" fill="#5B4A0E">Otro contenedor del sistema</text>
<rect x="2018" y="730" width="220" height="20" rx="6" fill="none" stroke="none"/>
<text x="2029" y="750" font-size="11" fill="#5B4A0E">Almacen de datos</text>
<rect x="2018" y="758" width="220" height="20" rx="6" fill="none" stroke="none"/>
<text x="2029" y="778" font-size="11" fill="#5B4A0E">Sistema fuera del contenedor</text>
</svg>
<text x="1145.0" y="184.0" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">[Personal del banco]</text>
<text x="1145.0" y="199.0" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">Atiende incidencias, reprocesa y</text>

<rect x="60" y="90" width="480" height="140" rx="6" fill="#FFF6D6" stroke="#D9B94C"/>
<text x="71" y="110" font-size="11" fill="#5B4A0E">El onboarding es una capacidad corporativa, reutilizable por oficina y por web, y</text>
<text x="71" y="124" font-size="11" fill="#5B4A0E">por eso queda fuera de la frontera del sistema. Lo que aqui se disena es su</text>
<text x="71" y="138" font-size="11" fill="#5B4A0E">integracion: al verificar la identidad, provisiona la credencial en el producto de</text>
<text x="71" y="152" font-size="11" fill="#5B4A0E">identidad.</text>
<rect x="1420" y="90" width="480" height="140" rx="6" fill="#FFF6D6" stroke="#D9B94C"/>
<text x="1431" y="110" font-size="11" fill="#5B4A0E">La norma obliga a notificar TODOS los movimientos, no solo los originados en el</text>
<text x="1431" y="124" font-size="11" fill="#5B4A0E">canal. Por eso el disparador es el propio Core y no la aplicacion, y se exigen dos</text>
<text x="1431" y="138" font-size="11" fill="#5B4A0E">proveedores con rutas independientes entre si.</text>
<rect x="764" y="966" width="480" height="21" rx="6" fill="none" stroke="none"/>
<text x="775" y="986" font-size="11" fill="#5B4A0E">Persona que interactua con el sistema</text>
<rect x="764" y="996" width="480" height="21" rx="6" fill="none" stroke="none"/>
<text x="775" y="1016" font-size="11" fill="#5B4A0E">Sistema en alcance de este diseno</text>
<rect x="764" y="1026" width="480" height="21" rx="6" fill="none" stroke="none"/>
<text x="775" y="1046" font-size="11" fill="#5B4A0E">Sistema del banco, fuera del alcance de construccion</text>
<rect x="764" y="1056" width="480" height="21" rx="6" fill="none" stroke="none"/>
<text x="775" y="1076" font-size="11" fill="#5B4A0E">Sistema de un tercero</text>
<rect x="720" y="1085" width="520" height="20" rx="6" fill="none" stroke="none"/>
<text x="731" y="1105" font-size="11" fill="#5B4A0E">Linea discontinua: flujo asincrono dirigido por eventos.</text>

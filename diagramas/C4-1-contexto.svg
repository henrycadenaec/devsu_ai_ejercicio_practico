<text x="980.0" y="712.0" font-size="14" class="t" fill="#FFFFFF" text-anchor="middle">Plataforma de Banca por Internet</text>
<text x="980.0" y="730.0" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">[Sistema en alcance]</text>
<text x="980.0" y="745.0" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">Canal digital web y movil: consulta de movimientos, transferencias y pagos propios e</text>
<text x="980.0" y="758.0" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">interbancarios, notificacion de movimientos y registro de auditoria.</text>
<rect x="90" y="290" width="420" height="120" rx="8" fill="#8A8A8A" stroke="#6B6B6B" stroke-width="2"/>
<text x="300.0" y="341.0" font-size="14" class="t" fill="#FFFFFF" text-anchor="middle">Proveedor de Verificacion de Identidad</text>
<text x="300.0" y="359.0" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">[Sistema externo]</text>
<text x="300.0" y="374.0" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">Prueba de vida, verificacion documental y cotejo facial.</text>
<rect x="90" y="500" width="420" height="120" rx="8" fill="#4F6B7A" stroke="#37505C" stroke-width="2"/>
<text x="300.0" y="551.0" font-size="14" class="t" fill="#FFFFFF" text-anchor="middle">Plataforma de Onboarding Digital</text>
<text x="300.0" y="569.0" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">[Sistema del banco]</text>
<text x="300.0" y="584.0" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">Vincula clientes nuevos. Capacidad compartida por todos los canales.</text>
<rect x="90" y="710" width="420" height="120" rx="8" fill="#4F6B7A" stroke="#37505C" stroke-width="2"/>
<text x="300.0" y="761.0" font-size="14" class="t" fill="#FFFFFF" text-anchor="middle">Producto de Identidad</text>
<text x="300.0" y="779.0" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">[Sistema del banco]</text>
<text x="300.0" y="794.0" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">Autentica y emite credenciales. Se configura, no se desarrolla.</text>
<rect x="90" y="940" width="420" height="120" rx="8" fill="#4F6B7A" stroke="#37505C" stroke-width="2"/>
<text x="300.0" y="984.5" font-size="14" class="t" fill="#FFFFFF" text-anchor="middle">Core Bancario</text>
<text x="300.0" y="1002.5" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">[Sistema del banco]</text>
<text x="300.0" y="1017.5" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">Sistema de registro: clientes, productos, saldos, movimientos y</text>
<text x="300.0" y="1030.5" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">contabilidad.</text>
<rect x="90" y="1100" width="420" height="120" rx="8" fill="#4F6B7A" stroke="#37505C" stroke-width="2"/>
<text x="300.0" y="1151.0" font-size="14" class="t" fill="#FFFFFF" text-anchor="middle">Sistema Complementario de Cliente</text>
<text x="300.0" y="1169.0" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">[Sistema del banco]</text>
<text x="300.0" y="1184.0" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">Amplia la informacion del cliente cuando se requiere en detalle.</text>
<rect x="1450" y="290" width="420" height="120" rx="8" fill="#8A8A8A" stroke="#6B6B6B" stroke-width="2"/>
<text x="1660.0" y="341.0" font-size="14" class="t" fill="#FFFFFF" text-anchor="middle">Red de Pagos Interbancarios</text>
<text x="1660.0" y="359.0" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">[Sistema externo]</text>
<text x="1660.0" y="374.0" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">Sistema nacional de pagos: liquida por ciclos hacia otras entidades.</text>
<rect x="1450" y="460" width="420" height="120" rx="8" fill="#4F6B7A" stroke="#37505C" stroke-width="2"/>
<text x="1660.0" y="511.0" font-size="14" class="t" fill="#FFFFFF" text-anchor="middle">Servicio Corporativo de Cribado</text>
<text x="1660.0" y="529.0" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">[Sistema del banco]</text>
<text x="1660.0" y="544.0" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">Contrasta contra listas restrictivas antes de mover fondos.</text>
<rect x="1450" y="700" width="420" height="120" rx="8" fill="#8A8A8A" stroke="#6B6B6B" stroke-width="2"/>
<text x="1660.0" y="751.0" font-size="14" class="t" fill="#FFFFFF" text-anchor="middle">Proveedor de Mensajeria Primario</text>
<text x="1660.0" y="769.0" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">[Sistema externo]</text>
<text x="1660.0" y="784.0" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">Avisos por mensaje corto y correo electronico.</text>
<rect x="1450" y="880" width="420" height="120" rx="8" fill="#8A8A8A" stroke="#6B6B6B" stroke-width="2"/>
<text x="1660.0" y="931.0" font-size="14" class="t" fill="#FFFFFF" text-anchor="middle">Proveedor de Mensajeria Alternativo</text>
<text x="1660.0" y="949.0" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">[Sistema externo]</text>
<text x="1660.0" y="964.0" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">Segundo proveedor con ruta independiente del primario.</text>
<rect x="1450" y="1060" width="420" height="120" rx="8" fill="#8A8A8A" stroke="#6B6B6B" stroke-width="2"/>
<text x="1660.0" y="1111.0" font-size="14" class="t" fill="#FFFFFF" text-anchor="middle">Servicios de Notificacion Push</text>
<text x="1660.0" y="1129.0" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">[Sistema externo]</text>
<text x="1660.0" y="1144.0" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">Distribucion de avisos a dispositivos moviles.</text>
<rect x="720" y="969" width="34" height="21" rx="8" fill="#08427B" stroke="#052E56" stroke-width="2"/>

<rect x="1718.0" y="110" width="190" height="74" rx="8" fill="#438DD5" stroke="#2E6295" stroke-width="2"/>
<text x="1813.0" y="144.5" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Bus de eventos</text>
<text x="1813.0" y="160.5" font-size="10" fill="#FFFFFF" opacity="0.8" text-anchor="middle">[Amazon MSK]</text>
<rect x="1958" y="408" width="284" height="88" rx="6" fill="#FFF6D6" stroke="#D9B94C"/>
<text x="1970" y="427" font-size="11" fill="#5B4A0E">ADR-34 · Si el cliente reintenta por perdida de</text>
<text x="1970" y="441" font-size="11" fill="#5B4A0E">red, la misma clave devuelve la respuesta</text>
<text x="1970" y="455" font-size="11" fill="#5B4A0E">original. Es lo que impide el doble cargo, y es</text>
<text x="1970" y="469" font-size="11" fill="#5B4A0E">un FILTRO previo: ningun desarrollador puede</text>
<text x="1970" y="483" font-size="11" fill="#5B4A0E">olvidarlo al anadir una operacion.</text>
<rect x="1958" y="640" width="284" height="74" rx="6" fill="#FFF6D6" stroke="#D9B94C"/>
<text x="1970" y="659" font-size="11" fill="#5B4A0E">H-27 · El orden importa. Cribar DESPUES de mover</text>
<text x="1970" y="673" font-size="11" fill="#5B4A0E">el dinero invertiria la logica del cumplimiento:</text>
<text x="1970" y="687" font-size="11" fill="#5B4A0E">dejaria a la entidad habiendo ejecutado la</text>
<text x="1970" y="701" font-size="11" fill="#5B4A0E">operacion que debia impedir (ADR-35).</text>
<rect x="1958" y="1102" width="284" height="74" rx="6" fill="#FFF6D6" stroke="#D9B94C"/>
<text x="1970" y="1121" font-size="11" fill="#5B4A0E">El cliente recibe EN PROCESO, no un exito que</text>
<text x="1970" y="1135" font-size="11" fill="#5B4A0E">todavia no existe. La liquidacion interbancaria</text>
<text x="1970" y="1149" font-size="11" fill="#5B4A0E">ocurre por ciclos y puede tardar; prometer lo</text>
<text x="1970" y="1163" font-size="11" fill="#5B4A0E">contrario obligaria despues a desdecirse.</text>
<rect x="1958" y="1572" width="284" height="88" rx="6" fill="#FFF6D6" stroke="#D9B94C"/>
<text x="1970" y="1591" font-size="11" fill="#5B4A0E">ADR-33 · La compensacion no es un bloque de</text>
<text x="1970" y="1605" font-size="11" fill="#5B4A0E">recuperacion ante error: es un PASO DE NEGOCIO</text>
<text x="1970" y="1619" font-size="11" fill="#5B4A0E">previsto, con su propio registro y su propio</text>
<text x="1970" y="1633" font-size="11" fill="#5B4A0E">evento. Un fallo aqui deja la operacion en un</text>
<text x="1970" y="1647" font-size="11" fill="#5B4A0E">estado consultable, nunca en un limbo.</text>
<rect x="1958" y="1572" width="284" height="88" rx="6" fill="#FFF6D6" stroke="#D9B94C"/>
<text x="1970" y="1591" font-size="11" fill="#5B4A0E">Ningun paso mantiene una transaccion abierta</text>
<text x="1970" y="1605" font-size="11" fill="#5B4A0E">sobre la red de pagos. Intentarlo acoplaria la</text>
<text x="1970" y="1619" font-size="11" fill="#5B4A0E">disponibilidad del canal a la de una</text>
<text x="1970" y="1633" font-size="11" fill="#5B4A0E">infraestructura externa que opera por ciclos</text>
<text x="1970" y="1647" font-size="11" fill="#5B4A0E">(H-07).</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="2340" height="1160" viewBox="0 0 2340 1160" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666"/></marker><style>.t{font-weight:600}.s{opacity:.78}</style></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="40" y="46" font-size="25" font-weight="700" fill="#1F2937">Observabilidad · de la senal a la decision</text>
<text x="40" y="72" font-size="14" fill="#6B7280">Cuatro senales, un unico identificador de correlacion y objetivos de servicio que disparan la respuesta</text>
<rect x="60" y="110" width="480" height="640" rx="10" fill="none" stroke="#6B7280" stroke-width="2"/>
<text x="74" y="134" font-size="13" font-weight="600" fill="#6B7280">Origen de la senal</text>
<rect x="1120" y="110" width="560" height="640" rx="10" fill="none" stroke="#6B7280" stroke-width="2"/>
<text x="1134" y="134" font-size="13" font-weight="600" fill="#6B7280">Cuatro senales</text>
<rect x="1760" y="110" width="500" height="640" rx="10" fill="none" stroke="#6B7280" stroke-width="2"/>
<text x="1774" y="134" font-size="13" font-weight="600" fill="#6B7280">Uso de la senal</text>
<line x1="515.0" y1="205.0" x2="640.0" y2="370.0" stroke="#666" stroke-width="2" marker-end="url(#fl)"/>
<line x1="515.0" y1="321.0" x2="640.0" y2="400.0" stroke="#666" stroke-width="2" marker-end="url(#fl)"/>
<line x1="515.0" y1="437.0" x2="640.0" y2="430.0" stroke="#666" stroke-width="2" marker-end="url(#fl)"/>
<line x1="515.0" y1="553.0" x2="640.0" y2="460.0" stroke="#666" stroke-width="2" marker-end="url(#fl)"/>
<line x1="515.0" y1="669.0" x2="640.0" y2="490.0" stroke="#666" stroke-width="2" marker-end="url(#fl)"/>
<line x1="1020.0" y1="370.0" x2="1145.0" y2="217.5" stroke="#666" stroke-width="2" marker-end="url(#fl)"/>
<line x1="1020.0" y1="410.0" x2="1145.0" y2="362.5" stroke="#666" stroke-width="2" marker-end="url(#fl)"/>
<line x1="1020.0" y1="450.0" x2="1145.0" y2="507.5" stroke="#666" stroke-width="2" marker-end="url(#fl)"/>
<line x1="1020.0" y1="490.0" x2="1145.0" y2="652.5" stroke="#666" stroke-width="2" marker-end="url(#fl)"/>
<line x1="1655.0" y1="217.5" x2="1785.0" y2="205.0" stroke="#666" stroke-width="2" marker-end="url(#fl)"/>
<line x1="1655.0" y1="362.5" x2="1785.0" y2="321.0" stroke="#666" stroke-width="2" marker-end="url(#fl)"/>
<line x1="1655.0" y1="507.5" x2="1785.0" y2="437.0" stroke="#666" stroke-width="2" marker-end="url(#fl)"/>
<line x1="1655.0" y1="652.5" x2="1785.0" y2="553.0" stroke="#666" stroke-width="2" marker-end="url(#fl)"/>
<rect x="85" y="155" width="430" height="100" rx="8" fill="#438DD5" stroke="#2E6295" stroke-width="2"/>
<text x="300.0" y="203.0" font-size="14" class="t" fill="#FFFFFF" text-anchor="middle">Aplicaciones de canal</text>
<text x="300.0" y="222.0" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">Web y movil</text>
<rect x="85" y="271" width="430" height="100" rx="8" fill="#438DD5" stroke="#2E6295" stroke-width="2"/>
<text x="300.0" y="319.0" font-size="14" class="t" fill="#FFFFFF" text-anchor="middle">Borde y puerta de enlace</text>
<text x="300.0" y="338.0" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">CloudFront, WAF, API Gateway</text>
<rect x="85" y="387" width="430" height="100" rx="8" fill="#438DD5" stroke="#2E6295" stroke-width="2"/>
<text x="300.0" y="435.0" font-size="14" class="t" fill="#FFFFFF" text-anchor="middle">Servicios de dominio</text>
<text x="300.0" y="454.0" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">Arquetipo comun instrumentado</text>
<rect x="85" y="503" width="430" height="100" rx="8" fill="#438DD5" stroke="#2E6295" stroke-width="2"/>
<text x="300.0" y="551.0" font-size="14" class="t" fill="#FFFFFF" text-anchor="middle">Adaptadores</text>
<text x="300.0" y="570.0" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">Core, pagos y proveedores</text>
<rect x="85" y="619" width="430" height="100" rx="8" fill="#438DD5" stroke="#2E6295" stroke-width="2"/>
<text x="300.0" y="667.0" font-size="14" class="t" fill="#FFFFFF" text-anchor="middle">Almacenes y bus</text>
<text x="300.0" y="686.0" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">Metricas del propio servicio gestionado</text>
<rect x="640" y="330" width="380" height="200" rx="8" fill="#1168BD" stroke="#0B4884" stroke-width="2"/>
<text x="830.0" y="414.5" font-size="14" class="t" fill="#FFFFFF" text-anchor="middle">Recoleccion unificada</text>
<text x="830.0" y="432.5" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">[OpenTelemetry]</text>
<text x="830.0" y="447.5" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">Un unico identificador de traza atraviesa todos los saltos, del</text>
<text x="830.0" y="460.5" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">navegador al Core</text>
<rect x="1145" y="155" width="510" height="125" rx="8" fill="#438DD5" stroke="#2E6295" stroke-width="2"/>
<text x="1400.0" y="208.5" font-size="14" class="t" fill="#FFFFFF" text-anchor="middle">Metricas</text>
<text x="1400.0" y="226.5" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">[Amazon CloudWatch]</text>
<text x="1400.0" y="241.5" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">Latencia, tasa de error, saturacion y trafico</text>
<rect x="1145" y="300" width="510" height="125" rx="8" fill="#438DD5" stroke="#2E6295" stroke-width="2"/>
<text x="1400.0" y="353.5" font-size="14" class="t" fill="#FFFFFF" text-anchor="middle">Trazas</text>
<text x="1400.0" y="371.5" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">[AWS X-Ray]</text>
<text x="1400.0" y="386.5" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">Camino completo de una peticion entre servicios</text>
<rect x="1145" y="445" width="510" height="125" rx="8" fill="#438DD5" stroke="#2E6295" stroke-width="2"/>
<text x="1400.0" y="498.5" font-size="14" class="t" fill="#FFFFFF" text-anchor="middle">Registros</text>
<text x="1400.0" y="516.5" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">[OpenSearch]</text>
<text x="1400.0" y="531.5" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">Estructurados, sin datos personales en claro</text>
<rect x="1145" y="590" width="510" height="125" rx="8" fill="#438DD5" stroke="#2E6295" stroke-width="2"/>
<text x="1400.0" y="643.5" font-size="14" class="t" fill="#FFFFFF" text-anchor="middle">Eventos de negocio</text>
<text x="1400.0" y="661.5" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">[Amazon MSK]</text>
<text x="1400.0" y="676.5" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">Transferencias por minuto, avisos entregados, altas</text>
<rect x="1785" y="155" width="450" height="100" rx="8" fill="#438DD5" stroke="#2E6295" stroke-width="2"/>
<text x="2010.0" y="203.0" font-size="14" class="t" fill="#FFFFFF" text-anchor="middle">Paneles por recorrido</text>
<text x="2010.0" y="222.0" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">Uno por flujo de negocio, no por servidor</text>
<rect x="1785" y="271" width="450" height="100" rx="8" fill="#438DD5" stroke="#2E6295" stroke-width="2"/>
<text x="2010.0" y="319.0" font-size="14" class="t" fill="#FFFFFF" text-anchor="middle">Objetivos de servicio</text>
<text x="2010.0" y="338.0" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">Disponibilidad y latencia con margen de error</text>
<rect x="1785" y="387" width="450" height="100" rx="8" fill="#438DD5" stroke="#2E6295" stroke-width="2"/>
<text x="2010.0" y="435.0" font-size="14" class="t" fill="#FFFFFF" text-anchor="middle">Alerta por sintoma</text>
<text x="2010.0" y="454.0" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">Se alerta de lo que el cliente sufre</text>
<rect x="1785" y="503" width="450" height="100" rx="8" fill="#438DD5" stroke="#2E6295" stroke-width="2"/>
<text x="2010.0" y="551.0" font-size="14" class="t" fill="#FFFFFF" text-anchor="middle">Auditoria y evidencia</text>
<text x="2010.0" y="570.0" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">Camino separado, con retencion propia</text>
<rect x="1785" y="619" width="450" height="100" rx="8" fill="#438DD5" stroke="#2E6295" stroke-width="2"/>
<text x="2010.0" y="667.0" font-size="14" class="t" fill="#FFFFFF" text-anchor="middle">Costo por servicio</text>
<text x="2010.0" y="686.0" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">Etiquetado obligatorio en el despliegue</text>
<rect x="60" y="790" width="1060" height="50" rx="6" fill="#FFF6D6" stroke="#D9B94C"/>
<text x="71" y="810" font-size="11" fill="#5B4A0E">POR QUE UN UNICO IDENTIFICADOR DE CORRELACION: sin el, diagnosticar una lentitud obliga a cruzar a mano los registros de siete servicios. Con el, se reconstruye el recorrido completo de</text>
<text x="71" y="824" font-size="11" fill="#5B4A0E">una peticion concreta, incluido el salto hacia el Core. Es la diferencia entre horas y minutos de indisponibilidad (ADR-44).</text>
<rect x="60" y="990" width="1060" height="50" rx="6" fill="#FFF6D6" stroke="#D9B94C"/>
<text x="71" y="1010" font-size="11" fill="#5B4A0E">ALERTAR POR SINTOMA Y NO POR CAUSA: alertar de que la memoria de un nodo sube produce avisos que nadie atiende, porque casi nunca significan nada para el cliente. Alertar de que el</text>
<text x="71" y="1024" font-size="11" fill="#5B4A0E">consumo de margen de error de un objetivo se acelera significa que el cliente ya lo esta sufriendo, y eso si merece despertar a alguien (ADR-46).</text>
<rect x="1180" y="790" width="1080" height="50" rx="6" fill="#FFF6D6" stroke="#D9B94C"/>
<text x="1191" y="810" font-size="11" fill="#5B4A0E">OBSERVABILIDAD NO ES AUDITORIA. Las trazas y los registros tecnicos se conservan semanas y pueden muestrearse; el registro de auditoria se conserva siete anos, es integro y no se muestrea.</text>
<text x="1191" y="824" font-size="11" fill="#5B4A0E">Mezclarlos llevaria a perder evidencia por una politica de retencion pensada para diagnostico (ADR-31).</text>
<rect x="1180" y="995" width="1080" height="64" rx="6" fill="#FFF6D6" stroke="#D9B94C"/>
<text x="1191" y="1015" font-size="11" fill="#5B4A0E">LOS OBJETIVOS COMPROMETIDOS, TAL COMO LOS FIJAN LOS ESCENARIOS DE CALIDAD DE LA FASE 1: disponibilidad del canal 99,95 % mensual (ASR-01); consulta de movimientos p95 &lt;= 500 ms y p99 &lt;= 1 s</text>
<text x="1191" y="1029" font-size="11" fill="#5B4A0E">(ASR-05); transferencia entre cuentas propias p95 &lt;= 2 s (ASR-07); aviso entregado p95 &lt;= 2 min (ASR-08); inicio de sesion p95 &lt;= 1,5 s (ASR-19). Cada uno tiene su panel, su margen de error</text>
<text x="1191" y="1043" font-size="11" fill="#5B4A0E">y su respuesta definida.</text>
</svg>
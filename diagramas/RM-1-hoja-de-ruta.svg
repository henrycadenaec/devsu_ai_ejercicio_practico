<text x="71" y="1490" font-size="11" fill="#5B4A0E">POR QUE ESTE ORDEN: la consulta de movimientos va primero porque es el 80 % del uso y solo depende de la proyeccion, no del Core en linea. Las transferencias interbancarias van al final porque</text>
<text x="71" y="1504" font-size="11" fill="#5B4A0E">dependen de un tercero -la red de pagos- cuyos plazos no controla la entidad.</text>
<rect x="1230" y="1470" width="1110" height="120" rx="6" fill="#FFF6D6" stroke="#D9B94C"/>
<text x="1241" y="1490" font-size="11" fill="#5B4A0E">LO QUE NO SE APLAZA: el cumplimiento expresado como codigo y la auditoria arrancan en la primera ola. Incorporar controles al final obliga a rehacer lo construido y es la causa habitual de que</text>
<text x="1241" y="1504" font-size="11" fill="#5B4A0E">un proyecto regulado no llegue a produccion en plazo (ADR-50).</text>

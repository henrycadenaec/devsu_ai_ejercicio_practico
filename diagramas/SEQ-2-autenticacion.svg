<text x="293.0" y="312.0" font-size="11.5" font-weight="500" fill="#1F2937" text-anchor="middle">Abre la banca por internet</text>
<line x1="444.5" y1="378" x2="721.5" y2="378" stroke="#3F4A57" stroke-width="1.7" marker-end="url(#fl)"/>
<text x="583.0" y="357.0" font-size="11.5" font-weight="500" fill="#1F2937" text-anchor="middle">Solicita el estado de sesion</text>
<text x="583.0" y="370.0" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="middle">[HTTPS · mTLS]</text>
<line x1="721.5" y1="436" x2="444.5" y2="436" stroke="#3F4A57" stroke-width="1.7" marker-end="url(#fo)" stroke-dasharray="7 5"/>
<text x="583.0" y="428.0" font-size="11.5" font-weight="500" fill="#1F2937" text-anchor="middle">Sin sesion: direccion de autorizacion</text>
<line x1="444.5" y1="494" x2="1301.5" y2="494" stroke="#3F4A57" stroke-width="1.7" marker-end="url(#fl)"/>
<text x="873.0" y="473.0" font-size="11.5" font-weight="500" fill="#1F2937" text-anchor="middle">Redirige con reto de codigo (code_challenge)</text>
<text x="873.0" y="486.0" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="middle">[OIDC · PKCE · TLS 1.3]</text>
<line x1="154.5" y1="552" x2="1301.5" y2="552" stroke="#3F4A57" stroke-width="1.7" marker-end="url(#fl)"/>
<text x="728.0" y="544.0" font-size="11.5" font-weight="500" fill="#1F2937" text-anchor="middle">Se autentica con sus factores</text>
<line x1="1301.5" y1="610" x2="444.5" y2="610" stroke="#3F4A57" stroke-width="1.7" marker-end="url(#fo)" stroke-dasharray="7 5"/>
<text x="873.0" y="602.0" font-size="11.5" font-weight="500" fill="#1F2937" text-anchor="middle">Devuelve el codigo de autorizacion</text>
<line x1="444.5" y1="756" x2="721.5" y2="756" stroke="#3F4A57" stroke-width="1.7" marker-end="url(#fl)"/>
<text x="583.0" y="735.0" font-size="11.5" font-weight="500" fill="#1F2937" text-anchor="middle">Entrega el codigo</text>
<text x="583.0" y="748.0" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="middle">[HTTPS · mTLS]</text>
<line x1="734.5" y1="814" x2="1301.5" y2="814" stroke="#3F4A57" stroke-width="1.7" marker-end="url(#fl)"/>
<text x="1018.0" y="793.0" font-size="11.5" font-weight="500" fill="#1F2937" text-anchor="middle">Canjea codigo y verificador</text>
<text x="1018.0" y="806.0" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="middle">[OAuth 2.0 · mTLS]</text>
<line x1="1301.5" y1="872" x2="734.5" y2="872" stroke="#3F4A57" stroke-width="1.7" marker-end="url(#fo)" stroke-dasharray="7 5"/>
<text x="1018.0" y="864.0" font-size="11.5" font-weight="500" fill="#1F2937" text-anchor="middle">Credencial de acceso, de refresco y nivel AAL</text>
<line x1="734.5" y1="930" x2="1011.5" y2="930" stroke="#3F4A57" stroke-width="1.7" marker-end="url(#fl)"/>
<text x="873.0" y="909.0" font-size="11.5" font-weight="500" fill="#1F2937" text-anchor="middle">Guarda la credencial del lado del servidor</text>
<text x="873.0" y="922.0" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="middle">[TLS]</text>
<line x1="721.5" y1="988" x2="444.5" y2="988" stroke="#3F4A57" stroke-width="1.7" marker-end="url(#fo)" stroke-dasharray="7 5"/>
<text x="583.0" y="967.0" font-size="11.5" font-weight="500" fill="#1F2937" text-anchor="middle">Cookie de sesion: HttpOnly, SameSite y</text>
<text x="583.0" y="980.0" font-size="11.5" font-weight="500" fill="#1F2937" text-anchor="middle">Secure</text>
<line x1="154.5" y1="1134" x2="431.5" y2="1134" stroke="#3F4A57" stroke-width="1.7" marker-end="url(#fl)"/>
<text x="293.0" y="1126.0" font-size="11.5" font-weight="500" fill="#1F2937" text-anchor="middle">Ordena una transferencia de importe alto</text>
<line x1="444.5" y1="1218" x2="721.5" y2="1218" stroke="#3F4A57" stroke-width="1.7" marker-end="url(#fl)"/>
<text x="583.0" y="1197.0" font-size="11.5" font-weight="500" fill="#1F2937" text-anchor="middle">Envia la orden y el testigo anti-CSRF</text>
<text x="583.0" y="1210.0" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="middle">[HTTPS · mTLS]</text>
<line x1="734.5" y1="1276" x2="1591.5" y2="1276" stroke="#3F4A57" stroke-width="1.7" marker-end="url(#fl)"/>
<text x="1163.0" y="1255.0" font-size="11.5" font-weight="500" fill="#1F2937" text-anchor="middle">Consulta el nivel exigido para este importe</text>
<text x="1163.0" y="1268.0" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="middle">[gRPC · mTLS]</text>
<line x1="1591.5" y1="1334" x2="734.5" y2="1334" stroke="#3F4A57" stroke-width="1.7" marker-end="url(#fo)" stroke-dasharray="7 5"/>
<text x="1163.0" y="1326.0" font-size="11.5" font-weight="500" fill="#1F2937" text-anchor="middle">Exige nivel de autenticacion reforzado</text>
<line x1="721.5" y1="1392" x2="444.5" y2="1392" stroke="#3F4A57" stroke-width="1.7" marker-end="url(#fo)" stroke-dasharray="7 5"/>
<text x="583.0" y="1384.0" font-size="11.5" font-weight="500" fill="#1F2937" text-anchor="middle">Solicita confirmacion con segundo factor</text>
<line x1="154.5" y1="1450" x2="1301.5" y2="1450" stroke="#3F4A57" stroke-width="1.7" marker-end="url(#fl)"/>
<text x="728.0" y="1442.0" font-size="11.5" font-weight="500" fill="#1F2937" text-anchor="middle">Confirma con el segundo factor</text>
<line x1="1301.5" y1="1508" x2="734.5" y2="1508" stroke="#3F4A57" stroke-width="1.7" marker-end="url(#fl)" stroke-dasharray="7 5"/>
<text x="1018.0" y="1487.0" font-size="11.5" font-weight="500" fill="#1F2937" text-anchor="middle">Credencial con nivel elevado</text>
<text x="1018.0" y="1500.0" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="middle">[OIDC · TLS 1.3]</text>
<line x1="721.5" y1="1566" x2="444.5" y2="1566" stroke="#3F4A57" stroke-width="1.7" marker-end="url(#fo)" stroke-dasharray="7 5"/>
<text x="583.0" y="1558.0" font-size="11.5" font-weight="500" fill="#1F2937" text-anchor="middle">Operacion admitida a tramite</text>

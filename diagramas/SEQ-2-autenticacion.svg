<text x="148.0" y="144.5" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Cliente</text>
<text x="148.0" y="160.5" font-size="10" fill="#FFFFFF" opacity="0.8" text-anchor="middle">[Persona natural]</text>
<rect x="340.0" y="110" width="196" height="74" rx="8" fill="#438DD5" stroke="#2E6295" stroke-width="2"/>
<text x="438.0" y="144.5" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Aplicacion Web</text>
<text x="438.0" y="160.5" font-size="10" fill="#FFFFFF" opacity="0.8" text-anchor="middle">[Angular]</text>
<rect x="630.0" y="110" width="196" height="74" rx="8" fill="#1168BD" stroke="#0B4884" stroke-width="2"/>
<text x="728.0" y="144.5" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Backend de canal web</text>
<text x="728.0" y="160.5" font-size="10" fill="#FFFFFF" opacity="0.8" text-anchor="middle">[Spring Boot]</text>
<rect x="920.0" y="110" width="196" height="74" rx="8" fill="#438DD5" stroke="#2E6295" stroke-width="2"/>
<text x="1018.0" y="144.5" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Sesion</text>
<text x="1018.0" y="160.5" font-size="10" fill="#FFFFFF" opacity="0.8" text-anchor="middle">[ElastiCache Redis]</text>
<rect x="1210.0" y="110" width="196" height="74" rx="8" fill="#4F6B7A" stroke="#37505C" stroke-width="2"/>
<text x="1308.0" y="144.5" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Producto de Identidad</text>
<text x="1308.0" y="160.5" font-size="10" fill="#FFFFFF" opacity="0.8" text-anchor="middle">[Sistema del banco]</text>
<rect x="1500.0" y="110" width="196" height="74" rx="8" fill="#438DD5" stroke="#2E6295" stroke-width="2"/>
<text x="1598.0" y="144.5" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Politica de Riesgo</text>
<text x="1598.0" y="160.5" font-size="10" fill="#FFFFFF" opacity="0.8" text-anchor="middle">[Contenedor]</text>
<rect x="1746" y="498" width="284" height="102" rx="6" fill="#FFF6D6" stroke="#D9B94C"/>
<text x="1758" y="517" font-size="11" fill="#5B4A0E">RFC 7636 · PKCE hace inutil un codigo de</text>
<text x="1758" y="531" font-size="11" fill="#5B4A0E">autorizacion interceptado: sin el verificador</text>
<text x="1758" y="545" font-size="11" fill="#5B4A0E">original no puede canjearse. RFC 9700</text>
<text x="1758" y="559" font-size="11" fill="#5B4A0E">desaconseja expresamente el flujo de</text>
<text x="1758" y="573" font-size="11" fill="#5B4A0E">credenciales directas, que enviaria la</text>
<text x="1758" y="587" font-size="11" fill="#5B4A0E">contrasena a traves del canal (ADR-14).</text>
<rect x="1746" y="992" width="284" height="102" rx="6" fill="#FFF6D6" stroke="#D9B94C"/>
<text x="1758" y="1011" font-size="11" fill="#5B4A0E">ADR-10 · La credencial de acceso NUNCA llega al</text>
<text x="1758" y="1025" font-size="11" fill="#5B4A0E">navegador. Lo unico que viaja es una cookie</text>
<text x="1758" y="1039" font-size="11" fill="#5B4A0E">inaccesible desde guiones. Guardarla en el</text>
<text x="1758" y="1053" font-size="11" fill="#5B4A0E">almacenamiento del navegador la dejaria al</text>
<text x="1758" y="1067" font-size="11" fill="#5B4A0E">alcance de cualquier codigo inyectado en la</text>
<text x="1758" y="1081" font-size="11" fill="#5B4A0E">pagina.</text>
<rect x="1746" y="1570" width="284" height="88" rx="6" fill="#FFF6D6" stroke="#D9B94C"/>
<text x="1758" y="1589" font-size="11" fill="#5B4A0E">ADR-19 · El nivel exigido lo decide la POLITICA</text>
<text x="1758" y="1603" font-size="11" fill="#5B4A0E">DE RIESGO, no el codigo de cada pantalla. Asi</text>
<text x="1758" y="1617" font-size="11" fill="#5B4A0E">puede demostrarse ante el supervisor que</text>
<text x="1758" y="1631" font-size="11" fill="#5B4A0E">politica regia en cada momento, y cambiarla no</text>
<text x="1758" y="1645" font-size="11" fill="#5B4A0E">obliga a desplegar los canales.</text>
</svg>
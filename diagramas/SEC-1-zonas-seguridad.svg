<svg xmlns="http://www.w3.org/2000/svg" width="2160" height="1700" viewBox="0 0 2160 1700" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666"/></marker><style>.t{font-weight:600}.s{opacity:.78}</style></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="40" y="46" font-size="25" font-weight="700" fill="#1F2937">Zonas de Seguridad y Defensa en Profundidad</text>
<text x="40" y="72" font-size="14" fill="#6B7280">Que se detiene en cada capa y por que ninguna se considera suficiente por si sola</text>
<rect x="70" y="120" width="1360" height="168" rx="10" fill="none" stroke="#8A8A8A" stroke-width="2"/>
<text x="84" y="144" font-size="13" font-weight="600" fill="#8A8A8A">Zona publica · Internet</text>
<rect x="70" y="346" width="1360" height="168" rx="10" fill="none" stroke="#B45309" stroke-width="2"/>
<text x="84" y="370" font-size="13" font-weight="600" fill="#B45309">Zona de borde · primera barrera</text>
<rect x="70" y="572" width="1360" height="168" rx="10" fill="none" stroke="#0E7490" stroke-width="2"/>
<text x="84" y="596" font-size="13" font-weight="600" fill="#0E7490">Zona de entrada · identidad y contrato</text>
<rect x="70" y="798" width="1360" height="224" rx="10" fill="none" stroke="#1168BD" stroke-width="2"/>
<text x="84" y="822" font-size="13" font-weight="600" fill="#1168BD">Zona de aplicacion · sin salida a Internet</text>
<rect x="70" y="1080" width="1360" height="224" rx="10" fill="none" stroke="#065F46" stroke-width="2"/>
<text x="84" y="1104" font-size="13" font-weight="600" fill="#065F46">Zona de datos · sin ruta a Internet</text>
<rect x="70" y="1362" width="1360" height="224" rx="10" fill="none" stroke="#4C1D95" stroke-width="2"/>
<text x="84" y="1386" font-size="13" font-weight="600" fill="#4C1D95">Zona de administracion · acceso excepcional</text>
<line x1="750.0" y1="262.0" x2="750.0" y2="386.0" stroke="#666" stroke-width="2" marker-end="url(#fl)"/>
<rect x="583.4" y="307.0" width="333.2" height="34.0" rx="4" fill="#FFFFFF" stroke="#E5E7EB"/>
<text x="750.0" y="322.0" font-size="10.5" fill="#374151" text-anchor="middle">Todo el trafico entra por un unico camino: no hay puertas</text>
<text x="750.0" y="335.0" font-size="10.5" fill="#374151" text-anchor="middle">alternativas</text>
<line x1="750.0" y1="488.0" x2="750.0" y2="612.0" stroke="#666" stroke-width="2" marker-end="url(#fl)"/>
<rect x="603.0" y="533.0" width="294.0" height="34.0" rx="4" fill="#FFFFFF" stroke="#E5E7EB"/>
<text x="750.0" y="548.0" font-size="10.5" fill="#374151" text-anchor="middle">Lo que supera el borde llega todavia SIN identidad</text>
<text x="750.0" y="561.0" font-size="10.5" fill="#374151" text-anchor="middle">demostrada</text>
<line x1="750.0" y1="714.0" x2="750.0" y2="838.0" stroke="#666" stroke-width="2" marker-end="url(#fl)"/>
<rect x="600.2" y="759.0" width="299.6" height="34.0" rx="4" fill="#FFFFFF" stroke="#E5E7EB"/>
<text x="750.0" y="774.0" font-size="10.5" fill="#374151" text-anchor="middle">Lo que pasa de aqui ya tiene identidad verificada y</text>
<text x="750.0" y="787.0" font-size="10.5" fill="#374151" text-anchor="middle">contrato valido</text>
<line x1="750.0" y1="996.0" x2="750.0" y2="1120.0" stroke="#666" stroke-width="2" marker-end="url(#fl)"/>
<rect x="603.0" y="1047.5" width="294.0" height="21.0" rx="4" fill="#FFFFFF" stroke="#E5E7EB"/>
<text x="750.0" y="1062.5" font-size="10.5" fill="#374151" text-anchor="middle">Ningun servicio alcanza los datos de otro servicio</text>
<line x1="750.0" y1="1278.0" x2="750.0" y2="1402.0" stroke="#666" stroke-width="2" marker-end="url(#fl)"/>
<rect x="589.0" y="1323.0" width="322.0" height="34.0" rx="4" fill="#FFFFFF" stroke="#E5E7EB"/>
<text x="750.0" y="1338.0" font-size="10.5" fill="#374151" text-anchor="middle">La administracion no es un camino alternativo hacia los</text>
<text x="750.0" y="1351.0" font-size="10.5" fill="#374151" text-anchor="middle">datos</text>
<rect x="96" y="160" width="1308" height="46" rx="8" fill="#8A8A8A" stroke="#6B6B6B" stroke-width="2"/>
<text x="750.0" y="181.0" font-size="14" class="t" fill="#FFFFFF" text-anchor="middle">Cliente legitimo</text>
<text x="750.0" y="200.0" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">Navegador o aplicacion movil</text>
<rect x="96" y="216" width="1308" height="46" rx="8" fill="#8A8A8A" stroke="#6B6B6B" stroke-width="2"/>
<text x="750.0" y="237.0" font-size="14" class="t" fill="#FFFFFF" text-anchor="middle">Trafico no deseado</text>
<text x="750.0" y="256.0" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">Automatizado, abusivo o dirigido</text>
<rect x="96" y="386" width="1308" height="46" rx="8" fill="#438DD5" stroke="#2E6295" stroke-width="2"/>
<text x="750.0" y="407.0" font-size="14" class="t" fill="#FFFFFF" text-anchor="middle">AWS WAF y Shield</text>
<text x="750.0" y="426.0" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">Reglas gestionadas, control de bots y limite de tasa por origen</text>
<rect x="96" y="442" width="1308" height="46" rx="8" fill="#438DD5" stroke="#2E6295" stroke-width="2"/>
<text x="750.0" y="463.0" font-size="14" class="t" fill="#FFFFFF" text-anchor="middle">Amazon CloudFront</text>
<text x="750.0" y="482.0" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">Solo TLS 1.3; cabeceras de seguridad y transporte estricto</text>
<rect x="96" y="612" width="1308" height="46" rx="8" fill="#438DD5" stroke="#2E6295" stroke-width="2"/>
<text x="750.0" y="633.0" font-size="14" class="t" fill="#FFFFFF" text-anchor="middle">Amazon API Gateway</text>
<text x="750.0" y="652.0" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">Valida la firma de la credencial contra las claves publicadas</text>
<rect x="96" y="668" width="1308" height="46" rx="8" fill="#438DD5" stroke="#2E6295" stroke-width="2"/>
<text x="750.0" y="689.0" font-size="14" class="t" fill="#FFFFFF" text-anchor="middle">Validacion de esquema</text>
<text x="750.0" y="708.0" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">Rechaza lo que no cumple el contrato antes de entrar</text>
<rect x="96" y="838" width="1308" height="46" rx="8" fill="#438DD5" stroke="#2E6295" stroke-width="2"/>
<text x="750.0" y="859.0" font-size="14" class="t" fill="#FFFFFF" text-anchor="middle">Nodos de Amazon EKS</text>
<text x="750.0" y="878.0" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">Subredes privadas; salida solo por puntos de enlace declarados</text>
<rect x="96" y="894" width="1308" height="46" rx="8" fill="#438DD5" stroke="#2E6295" stroke-width="2"/>
<text x="750.0" y="915.0" font-size="14" class="t" fill="#FFFFFF" text-anchor="middle">Malla de servicios</text>
<text x="750.0" y="934.0" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">Autenticacion mutua obligatoria entre todos los servicios</text>
<rect x="96" y="950" width="1308" height="46" rx="8" fill="#438DD5" stroke="#2E6295" stroke-width="2"/>
<text x="750.0" y="971.0" font-size="14" class="t" fill="#FFFFFF" text-anchor="middle">Politicas de red</text>
<text x="750.0" y="990.0" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">Denegacion por defecto; solo se permite lo declarado</text>
<rect x="96" y="1120" width="1308" height="46" rx="8" fill="#438DD5" stroke="#2E6295" stroke-width="2"/>
<text x="750.0" y="1141.0" font-size="14" class="t" fill="#FFFFFF" text-anchor="middle">Bases y almacenes</text>
<text x="750.0" y="1160.0" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">Cifrado en reposo con clave propia; sin direccion publica</text>
<rect x="96" y="1176" width="1308" height="46" rx="8" fill="#438DD5" stroke="#2E6295" stroke-width="2"/>
<text x="750.0" y="1197.0" font-size="14" class="t" fill="#FFFFFF" text-anchor="middle">KMS y CloudHSM</text>
<text x="750.0" y="1216.0" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">Material critico en modulo certificado; rotacion programada</text>
<rect x="96" y="1232" width="1308" height="46" rx="8" fill="#438DD5" stroke="#2E6295" stroke-width="2"/>
<text x="750.0" y="1253.0" font-size="14" class="t" fill="#FFFFFF" text-anchor="middle">Datos sensibles</text>
<text x="750.0" y="1272.0" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">Enmascarados en registros y en entornos que no son produccion</text>
<rect x="96" y="1402" width="1308" height="46" rx="8" fill="#438DD5" stroke="#2E6295" stroke-width="2"/>
<text x="750.0" y="1423.0" font-size="14" class="t" fill="#FFFFFF" text-anchor="middle">Acceso justo a tiempo</text>
<text x="750.0" y="1442.0" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">Sin usuarios permanentes: se concede, se registra y caduca</text>
<rect x="96" y="1458" width="1308" height="46" rx="8" fill="#438DD5" stroke="#2E6295" stroke-width="2"/>
<text x="750.0" y="1479.0" font-size="14" class="t" fill="#FFFFFF" text-anchor="middle">Sin acceso remoto directo</text>
<text x="750.0" y="1498.0" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">Sesiones mediadas y grabadas</text>
<rect x="96" y="1514" width="1308" height="46" rx="8" fill="#438DD5" stroke="#2E6295" stroke-width="2"/>
<text x="750.0" y="1535.0" font-size="14" class="t" fill="#FFFFFF" text-anchor="middle">Cambios por tuberia</text>
<text x="750.0" y="1554.0" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">La consola no modifica produccion</text>
<rect x="1490" y="120" width="600" height="96" rx="6" fill="#FFF6D6" stroke="#D9B94C"/>
<text x="1501" y="140" font-size="11" fill="#5B4A0E">PRINCIPIO RECTOR: ninguna capa se considera suficiente. El diseno asume que cualquiera de ellas puede</text>
<text x="1501" y="154" font-size="11" fill="#5B4A0E">ser superada y que la siguiente debe seguir siendo un obstaculo real. Es lo contrario del modelo de</text>
<text x="1501" y="168" font-size="11" fill="#5B4A0E">perimetro, donde atravesar el borde concede acceso a todo lo que hay detras.</text>
<rect x="1490" y="250" width="600" height="110" rx="6" fill="#FFF6D6" stroke="#D9B94C"/>
<text x="1501" y="270" font-size="11" fill="#5B4A0E">POR QUE SE CIFRA TAMBIEN DENTRO: si se admitiera trafico interno sin cifrar ni autenticar, un unico</text>
<text x="1501" y="284" font-size="11" fill="#5B4A0E">servicio comprometido -o un contenedor con una dependencia vulnerable- podria suplantar a cualquier</text>
<text x="1501" y="298" font-size="11" fill="#5B4A0E">otro. La autenticacion mutua convierte cada llamada en una identidad verificable, no en una direccion</text>
<text x="1501" y="312" font-size="11" fill="#5B4A0E">de red confiable.</text>
<rect x="1490" y="394" width="600" height="96" rx="6" fill="#FFF6D6" stroke="#D9B94C"/>
<text x="1501" y="414" font-size="11" fill="#5B4A0E">POR QUE NO HAY SALIDA A INTERNET DESDE LA APLICACION: la extraccion de datos necesita un camino de</text>
<text x="1501" y="428" font-size="11" fill="#5B4A0E">salida. Si los nodos solo alcanzan puntos de enlace declarados, un compromiso no dispone de canal para</text>
<text x="1501" y="442" font-size="11" fill="#5B4A0E">sacar informacion, aunque consiga ejecutar codigo.</text>
<rect x="1490" y="524" width="600" height="96" rx="6" fill="#FFF6D6" stroke="#D9B94C"/>
<text x="1501" y="544" font-size="11" fill="#5B4A0E">POR QUE EL ACCESO ADMINISTRATIVO ES EXCEPCIONAL: en banca, el riesgo mas frecuente no es el intruso</text>
<text x="1501" y="558" font-size="11" fill="#5B4A0E">externo sino el acceso interno indebido o el error operativo. Un permiso permanente de administracion</text>
<text x="1501" y="572" font-size="11" fill="#5B4A0E">es un riesgo permanente; uno que se concede, se registra y caduca, no lo es.</text>
<rect x="1490" y="654" width="600" height="68" rx="6" fill="#FFF6D6" stroke="#D9B94C"/>
<text x="1501" y="674" font-size="11" fill="#5B4A0E">Trazabilidad: ADR-48 (segmentacion), ADR-49 (claves y secretos), ADR-20 (propagacion de identidad),</text>
<text x="1501" y="688" font-size="11" fill="#5B4A0E">ADR-50 (cumplimiento expresado como codigo) y criterio 13 de evaluacion.</text>
</svg>
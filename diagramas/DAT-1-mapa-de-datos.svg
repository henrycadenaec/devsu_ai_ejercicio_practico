<text x="74" y="424" font-size="13" font-weight="600" fill="#B45309">Datos derivados · replicas NO autoritativas</text>
<rect x="60" y="700" width="1500" height="420" rx="10" fill="none" stroke="#1168BD" stroke-width="2"/>
<text x="74" y="724" font-size="13" font-weight="600" fill="#1168BD">Datos de los que el canal SI es sistema de registro</text>
<rect x="1620" y="110" width="640" height="590" rx="10" fill="none" stroke="#6B7280" stroke-width="2"/>
<text x="1634" y="134" font-size="13" font-weight="600" fill="#6B7280">Clasificacion aplicada</text>

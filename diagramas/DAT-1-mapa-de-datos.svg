<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="40" y="46" font-size="25" font-weight="700" fill="#1F2937">Mapa de Datos · propiedad, caracter autoritativo y retencion</text>
<text x="40" y="72" font-size="14" fill="#6B7280">Quien es sistema de registro de cada dato y que se conserva, cuanto tiempo y por que</text>
<rect x="60" y="110" width="1500" height="250" rx="10" fill="none" stroke="#4F6B7A" stroke-width="2"/>
<text x="74" y="134" font-size="13" font-weight="600" fill="#4F6B7A">Sistema de registro · Core Bancario (fuera del alcance)</text>

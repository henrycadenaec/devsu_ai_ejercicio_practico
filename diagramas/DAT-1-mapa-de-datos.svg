<text x="810.0" y="525.5" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">[ElastiCache Redis]</text>
<text x="810.0" y="540.5" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">Caducidad corta; se puede vaciar sin perdida</text>
<path d="M1065,464 a235,14 0 0,1 470,0 l0,87 a235,14 0 0,1 -470,0 z" fill="#438DD5" stroke="#2E6295" stroke-width="2"/>
<ellipse cx="1300.0" cy="464" rx="235" ry="14" fill="#438DD5" stroke="#2E6295" stroke-width="2"/>
<text x="1300.0" y="507.5" font-size="14" class="t" fill="#FFFFFF" text-anchor="middle">Datos en el dispositivo</text>
<text x="1300.0" y="525.5" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">[Almacen cifrado]</text>
<text x="1300.0" y="540.5" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">Solo lo que la pantalla necesita mostrar</text>
<path d="M85,759 a235,14 0 0,1 470,0 l0,127 a235,14 0 0,1 -470,0 z" fill="#438DD5" stroke="#2E6295" stroke-width="2"/>
<ellipse cx="320.0" cy="759" rx="235" ry="14" fill="#438DD5" stroke="#2E6295" stroke-width="2"/>
<text x="320.0" y="822.5" font-size="14" class="t" fill="#FFFFFF" text-anchor="middle">Preferencias de aviso y contactos frecuentes</text>
<text x="320.0" y="840.5" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">[Aurora PostgreSQL]</text>
<text x="320.0" y="855.5" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">Dato personal · mientras el cliente este vinculado</text>
<path d="M575,759 a235,14 0 0,1 470,0 l0,127 a235,14 0 0,1 -470,0 z" fill="#438DD5" stroke="#2E6295" stroke-width="2"/>
<ellipse cx="810.0" cy="759" rx="235" ry="14" fill="#438DD5" stroke="#2E6295" stroke-width="2"/>
<text x="810.0" y="822.5" font-size="14" class="t" fill="#FFFFFF" text-anchor="middle">Registro de auditoria de la actividad</text>
<text x="810.0" y="840.5" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">[OpenSearch + S3 con Object Lock]</text>
<text x="810.0" y="855.5" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">Bitemporal e inmutable · 7 anos</text>
<path d="M1065,759 a235,14 0 0,1 470,0 l0,127 a235,14 0 0,1 -470,0 z" fill="#438DD5" stroke="#2E6295" stroke-width="2"/>
<ellipse cx="1300.0" cy="759" rx="235" ry="14" fill="#438DD5" stroke="#2E6295" stroke-width="2"/>
<text x="1300.0" y="822.5" font-size="14" class="t" fill="#FFFFFF" text-anchor="middle">Evidencia de entrega de avisos</text>
<text x="1300.0" y="840.5" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">[S3 con Object Lock]</text>
<text x="1300.0" y="855.5" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">Carga probatoria · 7 anos (contenido del mensaje, 12 meses)</text>
<path d="M85,934 a235,14 0 0,1 470,0 l0,127 a235,14 0 0,1 -470,0 z" fill="#438DD5" stroke="#2E6295" stroke-width="2"/>
<ellipse cx="320.0" cy="934" rx="235" ry="14" fill="#438DD5" stroke="#2E6295" stroke-width="2"/>
<text x="320.0" y="997.5" font-size="14" class="t" fill="#FFFFFF" text-anchor="middle">Claves de idempotencia</text>
<text x="320.0" y="1015.5" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">[DynamoDB]</text>
<text x="320.0" y="1030.5" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">Tecnico · caduca a las 24 horas</text>
<path d="M575,934 a235,14 0 0,1 470,0 l0,127 a235,14 0 0,1 -470,0 z" fill="#438DD5" stroke="#2E6295" stroke-width="2"/>
<ellipse cx="810.0" cy="934" rx="235" ry="14" fill="#438DD5" stroke="#2E6295" stroke-width="2"/>
<text x="810.0" y="997.5" font-size="14" class="t" fill="#FFFFFF" text-anchor="middle">Estado de las operaciones y bandeja de salida</text>
<text x="810.0" y="1015.5" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">[Aurora PostgreSQL]</text>
<text x="810.0" y="1030.5" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">Operativo · 24 meses en linea, despues al archivo</text>
<rect x="1645" y="155" width="590" height="118" rx="8" fill="#85BBF0" stroke="#5D82A8" stroke-width="2"/>
<text x="1940.0" y="205.0" font-size="14" class="t" fill="#000000" text-anchor="middle">Critico</text>
<text x="1940.0" y="223.0" font-size="10.5" class="s" fill="#000000" text-anchor="middle">[Credenciales y material de claves]</text>
<text x="1940.0" y="238.0" font-size="10.5" class="s" fill="#000000" text-anchor="middle">Modulo certificado; nunca en registros</text>
<rect x="1645" y="287" width="590" height="118" rx="8" fill="#85BBF0" stroke="#5D82A8" stroke-width="2"/>
<text x="1940.0" y="337.0" font-size="14" class="t" fill="#000000" text-anchor="middle">Restringido</text>
<text x="1940.0" y="355.0" font-size="10.5" class="s" fill="#000000" text-anchor="middle">[Identificadores de cuenta, importes y biometria]</text>
<text x="1940.0" y="370.0" font-size="10.5" class="s" fill="#000000" text-anchor="middle">Cifrado con clave propia; enmascarado en registros</text>
<rect x="1645" y="419" width="590" height="118" rx="8" fill="#85BBF0" stroke="#5D82A8" stroke-width="2"/>
<text x="1940.0" y="469.0" font-size="14" class="t" fill="#000000" text-anchor="middle">Interno</text>
<text x="1940.0" y="487.0" font-size="10.5" class="s" fill="#000000" text-anchor="middle">[Trazas y metricas tecnicas]</text>
<text x="1940.0" y="502.0" font-size="10.5" class="s" fill="#000000" text-anchor="middle">Cifrado; sin identificadores directos</text>
<rect x="1645" y="551" width="590" height="118" rx="8" fill="#85BBF0" stroke="#5D82A8" stroke-width="2"/>
<text x="1940.0" y="601.0" font-size="14" class="t" fill="#000000" text-anchor="middle">Publico</text>
<text x="1940.0" y="619.0" font-size="10.5" class="s" fill="#000000" text-anchor="middle">[Catalogos y textos de la interfaz]</text>
<text x="1940.0" y="634.0" font-size="10.5" class="s" fill="#000000" text-anchor="middle">Sin restriccion</text>
<rect x="85" y="270" width="1450" height="36" rx="6" fill="#FFF6D6" stroke="#D9B94C"/>
<text x="96" y="290" font-size="11" fill="#5B4A0E">El canal NO es sistema de registro de ninguno de estos datos. Puede leerlos y puede ordenar operaciones sobre ellos, pero la version valida es siempre la del Core. Cualquier discrepancia se resuelve a favor del Core, nunca al reves (ADR-23).</text>
<rect x="85" y="580" width="1450" height="50" rx="6" fill="#FFF6D6" stroke="#D9B94C"/>
<text x="96" y="600" font-size="11" fill="#5B4A0E">H-18 · Se declara EXPRESAMENTE que estas replicas no son autoritativas y que pueden ir por detras del Core unos segundos. Presentar una proyeccion como si fuera el saldo contable es el error que convierte una optimizacion de rendimiento en un problema</text>
<text x="96" y="614" font-size="11" fill="#5B4A0E">regulatorio: ante una discrepancia, la entidad no podria sostener que el dato mostrado era el valido (ADR-28).</text>
<rect x="1620" y="700" width="640" height="64" rx="6" fill="#FFF6D6" stroke="#D9B94C"/>
<text x="1631" y="720" font-size="11" fill="#5B4A0E">PRINCIPIO DE MINIMIZACION: cada conjunto de datos tiene un responsable, una clasificacion y un plazo. Lo que</text>
<text x="1631" y="734" font-size="11" fill="#5B4A0E">no tiene plazo definido acaba conservandose para siempre, y conservar datos personales sin justificacion es</text>
<text x="1631" y="748" font-size="11" fill="#5B4A0E">por si mismo un incumplimiento de la ley de proteccion de datos, no solo un coste (ADR-32).</text>
<rect x="1620" y="840" width="640" height="64" rx="6" fill="#FFF6D6" stroke="#D9B94C"/>
<text x="1631" y="860" font-size="11" fill="#5B4A0E">POR QUE EL CANAL SI ES REGISTRO DE ESTOS: las preferencias de aviso, la evidencia de entrega y el registro de</text>
<text x="1631" y="874" font-size="11" fill="#5B4A0E">actividad NO existen en el Core. Si el canal no los custodiase, la entidad no podria acreditar que aviso, ni</text>
<text x="1631" y="888" font-size="11" fill="#5B4A0E">que se le mostro al cliente. Por eso su retencion se trata con el mismo rigor que la contable.</text>
<rect x="1620" y="1000" width="640" height="50" rx="6" fill="#FFF6D6" stroke="#D9B94C"/>
<text x="1631" y="1020" font-size="11" fill="#5B4A0E">Trazabilidad: ADR-28 (consulta y comando), ADR-30 (persistencia por servicio), ADR-31 (auditoria), ADR-32</text>
<text x="1631" y="1034" font-size="11" fill="#5B4A0E">(ciclo de vida), ADR-37 (evidencia) · RF-08 · ASR-11.</text>
</svg>
<text x="627.0" y="222.0" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">Unico valor con validez contable</text>
<rect x="821" y="155" width="348" height="100" rx="8" fill="#4F6B7A" stroke="#37505C" stroke-width="2"/>
<text x="995.0" y="203.0" font-size="14" class="t" fill="#FFFFFF" text-anchor="middle">Movimientos</text>
<text x="995.0" y="222.0" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">Asiento y su fecha valor</text>
<rect x="1189" y="155" width="348" height="100" rx="8" fill="#4F6B7A" stroke="#37505C" stroke-width="2"/>
<text x="1363.0" y="203.0" font-size="14" class="t" fill="#FFFFFF" text-anchor="middle">Contabilidad</text>
<text x="1363.0" y="222.0" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">Cierre y cuadre diario</text>
<path d="M85,464 a235,14 0 0,1 470,0 l0,87 a235,14 0 0,1 -470,0 z" fill="#438DD5" stroke="#2E6295" stroke-width="2"/>
<ellipse cx="320.0" cy="464" rx="235" ry="14" fill="#438DD5" stroke="#2E6295" stroke-width="2"/>
<text x="320.0" y="507.5" font-size="14" class="t" fill="#FFFFFF" text-anchor="middle">Proyeccion de movimientos</text>
<text x="320.0" y="525.5" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">[Aurora PostgreSQL]</text>
<text x="320.0" y="540.5" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">Reconstruible desde el Core en cualquier momento</text>
<path d="M575,464 a235,14 0 0,1 470,0 l0,87 a235,14 0 0,1 -470,0 z" fill="#438DD5" stroke="#2E6295" stroke-width="2"/>
<ellipse cx="810.0" cy="464" rx="235" ry="14" fill="#438DD5" stroke="#2E6295" stroke-width="2"/>

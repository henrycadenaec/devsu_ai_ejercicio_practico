<text x="1790.0" y="825.0" font-size="14" class="t" fill="#FFFFFF" text-anchor="middle">Misma definicion aplicada</text>
<text x="1790.0" y="843.0" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">[Desplegada en cada cambio]</text>
<text x="1790.0" y="858.0" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">La region secundaria no se improvisa el dia del fallo</text>
<rect x="85" y="890" width="930" height="88" rx="8" fill="#438DD5" stroke="#2E6295" stroke-width="2"/>
<text x="550.0" y="931.5" font-size="14" class="t" fill="#FFFFFF" text-anchor="middle">Copias con bloqueo de borrado</text>
<text x="550.0" y="949.5" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">[Retencion independiente de la cuenta]</text>
<rect x="1325" y="890" width="930" height="88" rx="8" fill="#438DD5" stroke="#2E6295" stroke-width="2"/>
<text x="1790.0" y="931.5" font-size="14" class="t" fill="#FFFFFF" text-anchor="middle">Copia de las copias</text>
<text x="1790.0" y="949.5" font-size="10.5" class="s" fill="#FFFFFF" text-anchor="middle">[Cuenta separada, solo lectura]</text>
<rect x="60" y="1040" width="1110" height="104" rx="6" fill="#FFF6D6" stroke="#D9B94C"/>
<text x="71" y="1060" font-size="11" fill="#5B4A0E">PILOTO ENCENDIDO Y NO COPIA FRIA: la region secundaria ejecuta permanentemente el plano de control y una instancia minima de cada servicio. Es lo que permite comprometer una recuperacion en</text>
<text x="71" y="1074" font-size="11" fill="#5B4A0E">menos de una hora: no hay que construir nada, solo escalar lo que ya esta funcionando (ADR-42).</text>
<rect x="1210" y="1040" width="1110" height="104" rx="6" fill="#FFF6D6" stroke="#D9B94C"/>
<text x="1221" y="1060" font-size="11" fill="#5B4A0E">POR QUE NO ACTIVO-ACTIVO: dos regiones aceptando escrituras exigirian resolver conflictos sobre saldos, que es justamente el dato que no admite ambiguedad. El sobrecoste permanente tampoco se</text>
<text x="1221" y="1074" font-size="11" fill="#5B4A0E">justifica frente a un objetivo de una hora. Se descarta de forma consciente, no por omision.</text>
<rect x="60" y="1170" width="1110" height="104" rx="6" fill="#FFF6D6" stroke="#D9B94C"/>
<text x="71" y="1190" font-size="11" fill="#5B4A0E">LA PRUEBA FORMA PARTE DEL DISENO: la conmutacion se ensaya con periodicidad establecida y su resultado se registra. Un plan de recuperacion que nunca se ha ejecutado es una hipotesis, no un</text>
<text x="71" y="1204" font-size="11" fill="#5B4A0E">control: el supervisor pide evidencia del ensayo, no del documento.</text>
<rect x="1210" y="1170" width="1110" height="104" rx="6" fill="#FFF6D6" stroke="#D9B94C"/>
<text x="1221" y="1190" font-size="11" fill="#5B4A0E">QUE SE PIERDE EN EL PEOR CASO: hasta cinco minutos de escrituras confirmadas. Las operaciones monetarias en vuelo quedan en un estado consultable gracias a la saga y a la clave de idempotencia;</text>
<text x="1221" y="1204" font-size="11" fill="#5B4A0E">ninguna queda en un limbo sin registro (ADR-33, ADR-34).</text>
</svg>
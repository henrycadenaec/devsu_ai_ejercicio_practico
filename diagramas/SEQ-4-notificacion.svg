<text x="2033.0" y="144.5" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Cliente</text>
<text x="2033.0" y="160.5" font-size="10" fill="#FFFFFF" opacity="0.8" text-anchor="middle">[Persona natural]</text>
<rect x="2176" y="466" width="284" height="88" rx="6" fill="#FFF6D6" stroke="#D9B94C"/>
<text x="2188" y="485" font-size="11" fill="#5B4A0E">H-06 · La norma obliga a notificar TODOS los</text>
<text x="2188" y="499" font-size="11" fill="#5B4A0E">movimientos, no solo los ordenados desde el</text>
<text x="2188" y="513" font-size="11" fill="#5B4A0E">canal. Si el disparador fuese la aplicacion,</text>
<text x="2188" y="527" font-size="11" fill="#5B4A0E">quedarian sin avisar los de cajero, comercio y</text>
<text x="2188" y="541" font-size="11" fill="#5B4A0E">abonos entrantes, que son la mayoria.</text>
<rect x="2176" y="608" width="284" height="74" rx="6" fill="#FFF6D6" stroke="#D9B94C"/>
<text x="2188" y="627" font-size="11" fill="#5B4A0E">El bus entrega AL MENOS UNA VEZ: puede</text>
<text x="2188" y="641" font-size="11" fill="#5B4A0E">reentregar. La deduplicacion es lo que impide</text>
<text x="2188" y="655" font-size="11" fill="#5B4A0E">que el cliente reciba dos avisos del mismo</text>
<text x="2188" y="669" font-size="11" fill="#5B4A0E">movimiento.</text>
<rect x="2176" y="1046" width="284" height="88" rx="6" fill="#FFF6D6" stroke="#D9B94C"/>
<text x="2188" y="1065" font-size="11" fill="#5B4A0E">ADR-36 · La conmutacion solo aporta algo si las</text>
<text x="2188" y="1079" font-size="11" fill="#5B4A0E">dos rutas son INDEPENDIENTES: dos proveedores</text>
<text x="2188" y="1093" font-size="11" fill="#5B4A0E">sobre la misma infraestructura fallarian a la</text>
<text x="2188" y="1107" font-size="11" fill="#5B4A0E">vez. Lo que se exige por contrato es diversidad</text>
<text x="2188" y="1121" font-size="11" fill="#5B4A0E">de ruta, no pluralidad de contratos.</text>
<rect x="2176" y="1250" width="284" height="88" rx="6" fill="#FFF6D6" stroke="#D9B94C"/>
<text x="2188" y="1269" font-size="11" fill="#5B4A0E">ADR-37 · La evidencia del envio se conserva 7</text>
<text x="2188" y="1283" font-size="11" fill="#5B4A0E">anos; el contenido del mensaje, 12 meses. Se</text>
<text x="2188" y="1297" font-size="11" fill="#5B4A0E">satisface la carga probatoria ante una</text>
<text x="2188" y="1311" font-size="11" fill="#5B4A0E">reclamacion sin retener datos personales mas</text>
<text x="2188" y="1325" font-size="11" fill="#5B4A0E">tiempo del necesario.</text>
